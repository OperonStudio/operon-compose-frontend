name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is injected by Actions and can read this org's packages,
    # so there is no secret to create. The workflow previously asked for a
    # NODE_AUTH_TOKEN secret that was never set in any of these repos, and
    # every run since the packages were introduced failed on a 401.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run check

      - name: Test
        run: npm run test
